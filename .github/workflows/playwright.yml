name: Playwright automation

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/playwright.yml'
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'ENV for the tests: REMOTE (demo server) or LOCALHOST (needs a self-hosted runner); URLs are mapped in automation/shared/environments.ts'
        type: choice
        options: [REMOTE, LOCALHOST]
        default: REMOTE
      tags:
        description: 'Playwright --grep filter, for example @smoke or "@smoke|API-CAT". Use "." to run everything; empty runs @smoke, or the whole suite when shards is more than 1'
        type: string
        default: '@smoke'
      workers:
        description: 'Parallel workers: a number (4) or percentage (50%). Empty uses the project default (UI 1, API 1 on CI)'
        type: string
        default: ''
      retries:
        description: 'Retries per failed test. Tests that pass only on retry are reported as flaky'
        type: string
        default: '0'
      shards:
        description: 'Number of parallel runners per project (1 to 8). Each runs its own slice of the tests (Playwright --shard N/total). Empty or 1 runs everything in one job; shards split only the tests that match tags, so use "." in tags to split the whole suite'
        type: string
        default: ''
  # Nightly full regression against the demo server (REMOTE), split over 4 shards; the workflow runs on the default branch only.
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides how many shard jobs the matrix below starts: 4 nightly, the `shards` input on manual runs, otherwise 1.
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    env:
      EVENT: ${{ github.event_name }}
      SHARDS_INPUT: ${{ inputs.shards }}
    steps:
      - id: plan
        shell: bash
        run: |
          total=1
          if [ "$EVENT" = "schedule" ]; then total=4; elif [ -n "$SHARDS_INPUT" ]; then total="$SHARDS_INPUT"; fi
          if ! [[ "$total" =~ ^[1-8]$ ]]; then echo "::error::shards must be a whole number from 1 to 8"; exit 1; fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 1 "$total")]" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    name: ${{ matrix.project }} on ${{ inputs.environment || 'REMOTE' }} (${{ github.event_name == 'schedule' && 'nightly full regression' || inputs.tags || (needs.plan.outputs.total != '1' && 'full suite') || '@smoke' }})${{ needs.plan.outputs.total != '1' && format(' shard {0}/{1}', matrix.shard, needs.plan.outputs.total) || '' }}
    # A GitHub-hosted runner cannot reach http://localhost; that environment needs a runner on the Docker host.
    runs-on: ${{ (inputs.environment || 'REMOTE') == 'LOCALHOST' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: ${{ github.event_name == 'schedule' && 120 || 30 }}
    environment: ${{ inputs.environment || 'REMOTE' }}
    strategy:
      fail-fast: false
      matrix:
        project: [api, ui]
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    defaults:
      run:
        # Explicit bash so the same scripts run on a Windows self-hosted runner (Git Bash).
        shell: bash
        working-directory: automation/${{ matrix.project }}
    env:
      # Inputs reach scripts through env, not ${{ }} interpolation, to avoid script injection.
      ENV: ${{ inputs.environment || 'REMOTE' }}
      GREP: ${{ inputs.tags || '@smoke' }}
      TAGS_INPUT: ${{ inputs.tags }}
      # A scheduled run has no inputs: it runs every test instead of the @smoke subset.
      FULL_RUN: ${{ github.event_name == 'schedule' }}
      SHARD: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ needs.plan.outputs.total }}
      WORKERS: ${{ inputs.workers }}
      RETRIES: ${{ inputs.retries || '0' }}
      # Tests pick their role in code; a role without secrets in this environment is skipped.
      SUPERUSER_USERNAME: ${{ secrets.SUPERUSER_USERNAME }}
      SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
      READER_USERNAME: ${{ secrets.READER_USERNAME }}
      READER_PASSWORD: ${{ secrets.READER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6

      - name: Check superuser secrets
        run: |
          echo "ENV: $ENV, grep: $GREP, workers: ${WORKERS:-default}, retries: $RETRIES"
          if [ -z "$SUPERUSER_USERNAME" ] || [ -z "$SUPERUSER_PASSWORD" ]; then
            echo "::error::The $ENV environment needs SUPERUSER_USERNAME and SUPERUSER_PASSWORD secrets"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/${{ matrix.project }}/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Typecheck
        run: npm run typecheck

      - name: Check spec layering
        run: npm run lint:specs

      - name: Cache Playwright browsers
        if: matrix.project == 'ui' && runner.os == 'Linux'
        id: cache-playwright-browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-binaries-${{ hashFiles('automation/ui/package-lock.json') }}

      - name: Install Playwright system dependencies
        if: matrix.project == 'ui' && runner.os == 'Linux'
        run: npx playwright install-deps chromium
        timeout-minutes: 5

      - name: Install browsers
        if: matrix.project == 'ui' && steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
        timeout-minutes: 10

      - name: Run tests (${{ github.event_name == 'schedule' && 'full regression' || (needs.plan.outputs.total != '1' && inputs.tags == '' && 'full suite slice') || env.GREP }})
        run: |
          args=()
          # The @smoke default must not apply to a sharded run, or the shards would split only the smoke tests.
          if [ "$FULL_RUN" != "true" ] && { [ -n "$TAGS_INPUT" ] || [ "$SHARD_TOTAL" = "1" ]; }; then args+=(--grep "$GREP"); fi
          if [ "$SHARD_TOTAL" != "1" ]; then args+=(--shard "$SHARD/$SHARD_TOTAL"); fi
          npx playwright test "${args[@]}" --pass-with-no-tests

      # Traces in these folders are already scrubbed by src/global-teardown.ts.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: |
            automation/${{ matrix.project }}/playwright-report/
            automation/${{ matrix.project }}/test-results/
          retention-days: 7

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npm run allure:generate

      # Trace attachments in allure-results are scrubbed by src/global-teardown.ts before the report is built.
      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: automation/${{ matrix.project }}/allure-report/
          retention-days: 7
