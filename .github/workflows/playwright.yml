name: Playwright automation

on:
  pull_request:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/playwright.yml'
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'LOCALHOST (default) starts a throwaway InvenTree and runs against http://localhost. REMOTE runs thone public demo: before choosing it, open https://demo.inventree.org/web/login and check it loads as it is down sometimes'
        type: choice
        options: [LOCALHOST, REMOTE]
        default: LOCALHOST
      tags:
        description: 'Playwright --grep filter, for example @smoke or "@smoke|API-CAT". Use "." to run everything; empty runs @smoke, or the whole suite when shards is more than 1'
        type: string
        default: '@smoke'
      workers:
        description: 'Parallel workers: a number or percentage (50%). Considering the load, safe number on demo site is 2'
        type: string
        default: '2'
      retries:
        description: 'Retries per failed test. Empty = no retries. Tests that pass only on retry are reported as flaky'
        type: string
        default: '2'
      shards:
        description: 'Parallel jobs per project (1-8); empty or 1 = one job. Shards split only tests matching tags; use "." to split the whole suite'
        type: string
        default: ''
  # Nightly full regression on a throwaway LOCALHOST instance, split over 4 shards; the workflow runs on the default branch only.
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Separate Allure history per environment and run type, so trends compare like with like (nightly full, manual, smoke).
  ALLURE_HISTORY_KEY: ${{ inputs.environment || 'LOCALHOST' }}-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && 'manual' || 'smoke' }}

jobs:
  # Decides how many shard jobs the matrix below starts: 4 nightly, the `shards` input on manual runs, otherwise 1.
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total: ${{ steps.plan.outputs.total }}
    env:
      EVENT: ${{ github.event_name }}
      SHARDS_INPUT: ${{ inputs.shards }}
    steps:
      - id: plan
        shell: bash
        run: |
          total=1
          if [ "$EVENT" = "schedule" ]; then total=4; elif [ -n "$SHARDS_INPUT" ]; then total="$SHARDS_INPUT"; fi
          if ! [[ "$total" =~ ^[1-8]$ ]]; then echo "::error::shards must be a whole number from 1 to 8"; exit 1; fi
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 1 "$total")]" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    name: ${{ matrix.project }} on ${{ inputs.environment || 'LOCALHOST' }} (${{ github.event_name == 'schedule' && 'nightly full regression' || inputs.tags || (needs.plan.outputs.total != '1' && 'full suite') || '@smoke' }})${{ needs.plan.outputs.total != '1' && format(' shard {0}/{1}', matrix.shard, needs.plan.outputs.total) || '' }}
    # LOCALHOST does not reach a developer machine: each job starts its own InvenTree in Docker on the runner.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 120 || 45 }}
    environment: ${{ inputs.environment || 'LOCALHOST' }}
    strategy:
      fail-fast: false
      matrix:
        project: [api, ui]
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    defaults:
      run:
        shell: bash
        working-directory: automation/${{ matrix.project }}
    env:
      # Inputs reach scripts through env, not ${{ }} interpolation, to avoid script injection.
      # Pull requests, pushes, and the nightly run have no inputs, so they also use LOCALHOST; REMOTE is a manual choice only.
      ENV: ${{ inputs.environment || 'LOCALHOST' }}
      # Version of the throwaway LOCALHOST instance; keep it equal to the local reference instance.
      INVENTREE_VERSION: '1.6.3'
      GREP: ${{ inputs.tags || '@smoke' }}
      TAGS_INPUT: ${{ inputs.tags }}
      # A scheduled run has no inputs: it runs every test instead of the @smoke subset.
      FULL_RUN: ${{ github.event_name == 'schedule' }}
      SHARD: ${{ matrix.shard }}
      SHARD_TOTAL: ${{ needs.plan.outputs.total }}
      # 2 workers and 2 retries by default. On LOCALHOST, parallel category writes can corrupt the category tree (README finding).
      WORKERS: ${{ inputs.workers || '2' }}
      # Manual runs: the retries box (default 2, cleared = 0). Push, PR, and nightly runs have no inputs and use 2.
      RETRIES: ${{ github.event_name != 'workflow_dispatch' && '2' || inputs.retries || '0' }}
      # Tests pick their role in code; a role without secrets in this environment is skipped.
      SUPERUSER_USERNAME: ${{ secrets.SUPERUSER_USERNAME }}
      SUPERUSER_PASSWORD: ${{ secrets.SUPERUSER_PASSWORD }}
      READER_USERNAME: ${{ secrets.READER_USERNAME }}
      READER_PASSWORD: ${{ secrets.READER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6

      - name: Check superuser secrets
        if: env.ENV == 'REMOTE'
        run: |
          echo "ENV: $ENV, grep: $GREP, workers: ${WORKERS:-default}, retries: $RETRIES"
          if [ -z "$SUPERUSER_USERNAME" ] || [ -z "$SUPERUSER_PASSWORD" ]; then
            echo "::error::The $ENV environment needs SUPERUSER_USERNAME and SUPERUSER_PASSWORD secrets"
            exit 1
          fi

      # Fails fast with a clear message instead of every test timing out when the demo is down.
      - name: Check https://demo.inventree.org is reachable
        if: env.ENV == 'REMOTE'
        run: |
          if ! curl -fsS --max-time 30 -o /dev/null https://demo.inventree.org/web/login; then
            echo "::error::https://demo.inventree.org/web/login is not reachable. Re-run the workflow with environment LOCALHOST."
            exit 1
          fi

      # Generates a superuser and a view-only reader for this run only, exported as LOCAL_SUPERUSER_* and LOCAL_READER_*.
      - name: Start InvenTree ${{ env.INVENTREE_VERSION }} on http://localhost
        if: env.ENV == 'LOCALHOST'
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/start-local-inventree.sh
        timeout-minutes: 15

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/${{ matrix.project }}/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        timeout-minutes: 5

      - name: Typecheck
        run: npm run typecheck

      - name: Check spec layering
        run: npm run lint:specs

      - name: Cache Playwright browsers
        if: matrix.project == 'ui' && runner.os == 'Linux'
        id: cache-playwright-browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-binaries-${{ hashFiles('automation/ui/package-lock.json') }}

      - name: Install Playwright system dependencies
        if: matrix.project == 'ui' && runner.os == 'Linux'
        run: npx playwright install-deps chromium
        timeout-minutes: 5

      - name: Install browsers
        if: matrix.project == 'ui' && steps.cache-playwright-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --only-shell chromium
        timeout-minutes: 10

      - name: Run tests (${{ github.event_name == 'schedule' && 'full regression' || (needs.plan.outputs.total != '1' && inputs.tags == '' && 'full suite slice') || env.GREP }})
        env:
          # LOCALHOST uses the users generated for this run; REMOTE uses the environment secrets.
          SUPERUSER_USERNAME: ${{ env.LOCAL_SUPERUSER_USERNAME || secrets.SUPERUSER_USERNAME }}
          SUPERUSER_PASSWORD: ${{ env.LOCAL_SUPERUSER_PASSWORD || secrets.SUPERUSER_PASSWORD }}
          READER_USERNAME: ${{ env.LOCAL_READER_USERNAME || secrets.READER_USERNAME }}
          READER_PASSWORD: ${{ env.LOCAL_READER_PASSWORD || secrets.READER_PASSWORD }}
        run: |
          args=()
          # The @smoke default must not apply to a sharded run, or the shards would split only the smoke tests.
          if [ "$FULL_RUN" != "true" ] && { [ -n "$TAGS_INPUT" ] || [ "$SHARD_TOTAL" = "1" ]; }; then args+=(--grep "$GREP"); fi
          if [ "$SHARD_TOTAL" != "1" ]; then args+=(--shard "$SHARD/$SHARD_TOTAL"); fi
          npx playwright test "${args[@]}" --pass-with-no-tests

      - name: Show InvenTree server log
        if: failure() && env.ENV == 'LOCALHOST' && env.INVENTREE_COMPOSE_DIR != ''
        working-directory: ${{ env.INVENTREE_COMPOSE_DIR }}
        run: docker compose logs --tail 200 inventree-server

      # Single job: publish the final reports directly. Traces are already scrubbed by src/global-teardown.ts.
      - name: Upload Playwright report
        if: ${{ !cancelled() && needs.plan.outputs.total == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: automation/${{ matrix.project }}/playwright-report/
          retention-days: 14
          overwrite: true

      # Latest history of this project and run type; a new key is saved after each report.
      - name: Restore Allure history
        if: ${{ !cancelled() && needs.plan.outputs.total == '1' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # actions/cache@v5
        with:
          path: automation/${{ matrix.project }}/allure-history
          key: allure-history-${{ matrix.project }}-${{ env.ALLURE_HISTORY_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: allure-history-${{ matrix.project }}-${{ env.ALLURE_HISTORY_KEY }}-

      - name: Generate Allure report
        if: ${{ !cancelled() && needs.plan.outputs.total == '1' }}
        run: npm run allure:generate

      - name: Save Allure history
        if: ${{ !cancelled() && needs.plan.outputs.total == '1' && hashFiles(format('automation/{0}/allure-history/history.jsonl', matrix.project)) != '' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # actions/cache@v5
        with:
          path: automation/${{ matrix.project }}/allure-history
          key: allure-history-${{ matrix.project }}-${{ env.ALLURE_HISTORY_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Allure report
        if: ${{ !cancelled() && needs.plan.outputs.total == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.project }}
          path: automation/${{ matrix.project }}/allure-report/
          retention-days: 14
          overwrite: true

      # Sharded: upload raw results for merge-reports. The blob reporter packs traces after global-teardown has scrubbed them.
      # overwrite: re-running a failed shard replaces its own upload instead of failing on the existing name.
      - name: Upload blob report
        if: ${{ !cancelled() && needs.plan.outputs.total != '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: automation/${{ matrix.project }}/blob-report/
          retention-days: 1
          overwrite: true

      - name: Upload Allure results
        if: ${{ !cancelled() && needs.plan.outputs.total != '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}-shard-${{ matrix.shard }}
          path: automation/${{ matrix.project }}/allure-results/
          retention-days: 1
          overwrite: true

  # Sharded runs only: combines every shard of a project into one HTML and one Allure report, even if some shards failed.
  merge-reports:
    name: Merge ${{ matrix.project }} reports
    if: ${{ !cancelled() && needs.plan.outputs.total != '1' }}
    needs: [plan, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [api, ui]
    defaults:
      run:
        shell: bash
        working-directory: automation/${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/${{ matrix.project }}/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        timeout-minutes: 5

      # Blob file names contain the shard number, so the shards do not overwrite each other.
      - name: Download blob reports
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # actions/download-artifact@v5
        with:
          path: automation/${{ matrix.project }}/all-blob-reports
          pattern: blob-report-${{ matrix.project }}-shard-*
          merge-multiple: true

      # Allure result files have unique (UUID) names, so the shards merge into one folder.
      - name: Download Allure results
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # actions/download-artifact@v5
        with:
          path: automation/${{ matrix.project }}/allure-results
          pattern: allure-results-${{ matrix.project }}-shard-*
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Restore Allure history
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # actions/cache@v5
        with:
          path: automation/${{ matrix.project }}/allure-history
          key: allure-history-${{ matrix.project }}-${{ env.ALLURE_HISTORY_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: allure-history-${{ matrix.project }}-${{ env.ALLURE_HISTORY_KEY }}-

      - name: Generate Allure report
        run: npm run allure:generate

      - name: Save Allure history
        if: ${{ hashFiles(format('automation/{0}/allure-history/history.jsonl', matrix.project)) != '' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # actions/cache@v5
        with:
          path: automation/${{ matrix.project }}/allure-history
          key: allure-history-${{ matrix.project }}-${{ env.ALLURE_HISTORY_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: automation/${{ matrix.project }}/playwright-report/
          retention-days: 14
          overwrite: true

      - name: Upload Allure report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.project }}
          path: automation/${{ matrix.project }}/allure-report/
          retention-days: 14
          overwrite: true
